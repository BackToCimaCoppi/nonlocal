# Nonlocal + Nginx reverse proxy (WSS only, outer rate limit, single-hop X-Forwarded-For, /health denied)
limit_req_zone $binary_remote_addr zone=nonlocal_ws_limit:10m rate=10r/m;

server {
    listen 443 ssl http2;
    server_name <YOUR_BRIDGE_DOMAIN>.example.com;

    ssl_certificate /etc/letsencrypt/live/<YOUR_BRIDGE_DOMAIN>.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_BRIDGE_DOMAIN>.example.com/privkey.pem;

    # Never expose local bridge /health endpoint over the reverse proxy
    location = /health {
        return 404;
    }

    location ~ ^/(acp|ws)$ {
        limit_req zone=nonlocal_ws_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:{{PORT}};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Single-hop overwrite ONLY (must pair with security.trustedProxies=["127.0.0.1"] or VPS loopback)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
